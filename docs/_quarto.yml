            - reference/arl_gop_ic.qmd
            - reference/arl_gop_oc.qmd
            - reference/cl_gop.qmd
            - reference/stat_gop.qmd
            - reference/chart_stat_gop.qmd
            - reference/test_gop_bootstrap.qmd
        - section: "Functions for spatial ordinal patterns"
          contents:
            - reference/arl_sop_ic.qmd
            - reference/arl_sop_oc.qmd
            - reference/cl_sop.qmd
            - reference/arl_sacf_ic.qmd
            - reference/arl_sacf_oc.qmd
    - title: "SOPs"
